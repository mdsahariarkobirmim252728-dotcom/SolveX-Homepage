<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SolveX</title>
    <link rel="stylesheet" href="./static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="auth-page-body">

    <!-- নেভিগেশন বার -->
    <header class="navbar">
        <div class="logo">SolveX</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="browse.html">Browse Problems</a></li>
                <li><a href="register.html" class="register-btn">Register</a></li>
            </ul>
        </nav>
    </header>

    <!-- লগইন ফর্ম -->
    <main class="auth-container">
        <div class="auth-form-wrapper">
            <h1>Welcome</h1>
            <h3>Login to your SolveX account.</h3>
            
            <!-- ফর্মের কোড শুরু -->
            <form class="auth-form" id="loginForm" onsubmit="return validateLoginForm()">
                <!-- ভুলের মেসেজ দেখানোর জন্য এই বক্সটি -->
                <div id="error-message" class="error-box"></div>

                <div class="input-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="text" id="email" placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>
                
                <button type="submit" class="auth-button">Login</button>
            </form>
            <!-- ফর্মের কোড শেষ -->

            <div class="auth-switch">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </main>

        <!-- =========================================
         JavaScript ভ্যালিডেশন কোড
    ========================================== -->
    <script>
        function validateLoginForm() {
            // ইনপুট ফিল্ড এবং এরর বক্সকে ধরা
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-message');

            // শুরু করার আগে ভুলের বক্সটি লুকিয়ে রাখা
            errorBox.style.display = 'none';
            errorBox.innerHTML = '';

            let errorMessages = [];

            // নিয়ম ১: ইমেইল খালি বা ভুল ফরম্যাটের কিনা?
            if (email === '') {
                errorMessages.push('Email Address is required.');
            } else {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    errorMessages.push('Please enter a valid email address.');
                }
            }
            
            // নিয়ম ২: পাসওয়ার্ড খালি কিনা?
            if (password === '') {
                errorMessages.push('Password is required.');
            }

            // যদি একটিও ভুল পাওয়া যায়
            if (errorMessages.length > 0) {
                errorBox.innerHTML = errorMessages.join('<br>');
                errorBox.style.display = 'block';
                return false; // ফর্ম সাবমিট হওয়া আটকে দেওয়া
            }

            // যদি কোনো ভুল না থাকে
            alert('Login successful!');
            // ভবিষ্যতে এখানে ফর্ম সাবমিট হবে।
            return false;
        }
    </script>
</body>
</html>

</body>
</html>
