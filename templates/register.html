{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - SolveX</title>
    <link rel="stylesheet" href="{% static 'style.css' %}?v={% now 'U' %}">
    <style>
        .form-container { max-width: 550px; margin: 50px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
        .form-title { text-align: center; margin-bottom: 25px; font-size: 28px; font-weight: 700; color: #333; }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .btn-submit { width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s; }
        .btn-submit:hover { background-color: #0056b3; }
        
        /* Solver Section Styles */
        .solver-toggle-wrap { margin-bottom: 20px; }
        .solver-toggle { background-color: #f1f5f9; padding: 15px; border-radius: 8px; display: flex; align-items: center; gap: 12px; border: 2px dashed #d1d5db; transition: all 0.3s; }
        .solver-toggle.active { border-color: #007bff; background-color: #e3f2fd; }
        .solver-toggle label { cursor: pointer; flex-grow: 1; margin: 0; }
        .solver-toggle input[type="checkbox"] { transform: scale(1.3); cursor: pointer; }

        #solver_fields { margin-top: 25px; padding-top: 25px; border-top: 1px solid #eee; display: none; /* Initially hidden */ }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body class="auth-page-body">

    <header class="navbar">
        <div class="logo">SolveX</div>
        <nav>
            <ul>
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'browse_problems' %}">Browse Problems</a></li>
                <li><a href="{% url 'login' %}" class="login-btn">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="form-container">
        <h2 class="form-title">Create an Account</h2>
        {% if messages %}
            {% for message in messages %}
                <div style="padding: 10px; background: #f8d7da; color: #721c24; border-radius: 4px; margin-bottom: 15px;">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="fullname" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="grid-2">
                <div class="form-group"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
                <div class="form-group"><label class="form-label">Confirm Password</label><input type="password" name="confirm_password" class="form-control" required></div>
            </div>

            <div class="solver-toggle-wrap">
                <div class="solver-toggle">
                    <input type="checkbox" id="is_solver_checkbox" name="is_solver">
                    <label for="is_solver_checkbox">I want to register as a Problem Solver</label>
                </div>
            </div>
            
            <div id="solver_fields">
                <h4 style="color: #007bff; text-align: center; margin-bottom: 20px;">Solver Information</h4>
                
                <div class="form-group">
                    <label class="form-label">Professional Title / Headline</label>
                    <input type="text" name="professional_title" class="form-control" placeholder="e.g., Expert Web Developer">
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone_number" class="form-control" placeholder="Required for solvers">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Skills (comma-separated)</label>
                    <input type="text" name="skills" class="form-control" placeholder="e.g., Python, Django, JavaScript">
                </div>

               <label>Interested In</label>
<input type="text" name="interested_in" class="form-control"
       placeholder="e.g. Web Development, App Development">

<label>Experience</label>
<textarea name="experience" class="form-control" rows="4"
          placeholder="Write your experience..."></textarea>

                <div class="form-group">
                    <label class="form-label">Address</label>
                    <textarea name="address" rows="2" class="form-control" placeholder="Required for solvers"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">About You / Bio (Optional)</label>
                    <textarea name="bio" rows="3" class="form-control"></textarea>
                </div>
            </div>

            <button type="submit" class="btn-submit">Register</button>
        </form>
    </div>

    <script>
        const checkbox = document.getElementById('is_solver_checkbox');
        const solverToggleDiv = document.querySelector('.solver-toggle');
        const solverFields = document.getElementById('solver_fields');
        const requiredFields = solverFields.querySelectorAll('input[name="phone_number"], textarea[name="address"], input[name="professional_title"], input[name="skills"]');

        function toggleSolverForm() {
            if (checkbox.checked) {
                solverFields.style.display = 'block';
                solverToggleDiv.classList.add('active');
                requiredFields.forEach(el => el.required = true);
            } else {
                solverFields.style.display = 'none';
                solverToggleDiv.classList.remove('active');
                requiredFields.forEach(el => el.required = false);
            }
        }
        
        checkbox.addEventListener('change', toggleSolverForm);
        solverToggleDiv.addEventListener('click', function(event) {
            if (event.target.tagName !== 'INPUT') {
                checkbox.checked = !checkbox.checked;
                toggleSolverForm();
            }
        });
    </script>
</body>
</html>
