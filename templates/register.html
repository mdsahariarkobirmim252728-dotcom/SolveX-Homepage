{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SolveX</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="auth-page-body">

    <header class="navbar">
        <div class="logo">SolveX</div>
        <nav>
            <ul>
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'browse_problems' %}">Browse Problems</a></li>
                <li><a href="{% url 'login' %}" class="login-btn">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-form-wrapper">
            <h2>Create Your Account</h2>
            <p>Join the SolveX community today!</p>
            <form class="auth-form" id="registerForm" onsubmit="return validateForm()">
                <div id="error-message" class="error-box"></div>
                <div class="input-group">
                    <label for="fullname"><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="fullname" placeholder="Enter your full name">
                </div>
                <div class="input-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="text" id="email" placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters">
                </div>
                <div class="input-group">
                    <label for="confirm-password"><i class="fas fa-lock"></i> Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm your password">
                </div>
                <button type="submit" class="auth-button">Register</button>
            </form>
            <div class="auth-switch">
                <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
            </div>
        </div>
    </main>

    <script>
        function validateForm() {
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorBox = document.getElementById('error-message');
            errorBox.style.display = 'none';
            errorBox.innerHTML = '';
            let errorMessages = [];
            if (fullname === '') { errorMessages.push('Full Name is required.'); }
            if (email === '') {
                errorMessages.push('Email Address is required.');
            } else {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) { errorMessages.push('Please enter a valid email address.'); }
            }
            if (password === '') {
                errorMessages.push('Password is required.');
            } else if (password.length < 6) {
                errorMessages.push('Password must be at least 6 characters long.');
            }
            if (confirmPassword === '') {
                errorMessages.push('Please confirm your password.');
            }
            if (password !== '' && confirmPassword !== '' && password !== confirmPassword) {
                if (!errorMessages.some(msg => msg.includes('Password'))) {
                   errorMessages.push('Passwords do not match.');
                }
            }
            if (errorMessages.length > 0) {
                errorBox.innerHTML = errorMessages.join('<br>');
                errorBox.style.display = 'block';
                return false;
            }
            alert('Registration successful! (Simulation)');
            return false;
        }
    </script>
</body>
</html>
