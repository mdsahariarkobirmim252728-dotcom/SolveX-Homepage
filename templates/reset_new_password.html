<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - SolveX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .card { max-width: 450px; margin: 100px auto; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Messages Display -->
        {% if messages %}
            <div style="max-width: 450px; margin: 20px auto;">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}" style="padding: 10px; background-color: #ffcccc; color: #a00; border: 1px solid #a00; border-radius: 5px;">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <div class="card bg-white rounded">
            <h2 class="text-center mb-4">Set New Password</h2>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3" style="margin-bottom: 15px;">
                    <label class="form-label">New Password:</label>
                    <input type="password" name="new_password" required class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                
                <div class="mb-3" style="margin-bottom: 15px;">
                    <label class="form-label">Confirm Password:</label>
                    <input type="password" name="confirm_password" required class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                
                <button type="submit" class="btn btn-success w-100" style="width: 100%; padding: 10px; background-color: #198754; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
                    Change Password
                </button>
            </form>
        </div>
    </div>

</body>
</html>
