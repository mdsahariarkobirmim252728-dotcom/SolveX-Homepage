{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post a Problem - SolveX</title>
  <link rel="stylesheet" href="{% static 'style.css' %}?v={% now 'U' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="auth-page-body">

<header class="navbar">
  <div class="logo">SolveX</div>
  <nav>
    <ul>
      <li><a href="{% url 'home' %}">Home</a></li>
      <li><a href="{% url 'browse_problems' %}">Browse Problems</a></li>
      <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
      <li><a href="{% url 'logout' %}" class="login-btn">Logout</a></li>
    </ul>
  </nav>
</header>

<main class="auth-container">
  <div class="auth-form-wrapper">
    <h2>Post a New Problem</h2>
    <p>Fill details and publish your problem.</p>

    {% if messages %}
      <div class="error-box" style="display:block;">
        {% for message in messages %}
          {{ message }}<br>
        {% endfor %}
      </div>
    {% endif %}

    <form class="auth-form" method="POST" action="{% url 'post_problem' %}">
      {% csrf_token %}

      <div class="input-group">
        <label>Title</label>
        <input type="text" name="title" placeholder="Problem title">
      </div>

      <div class="input-group">
        <label>Description</label>
        <textarea name="description" placeholder="Explain the problem..." class="big-textarea"></textarea>
      </div>

      <div class="input-group">
        <label>Budget </label>
        <input type="number" step="0.01" name="budget" placeholder="e.g. 50">
      </div>

      <button type="submit" class="auth-button">Post</button>
    </form>
  </div>
</main>

</body>
</html>
