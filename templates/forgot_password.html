<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SolveX</title>
    <!-- Bootstrap CSS (যদি আপনার প্রোজেক্টে থাকে, না থাকলে সমস্যা নেই) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .card { max-width: 450px; margin: 100px auto; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Messages Display (Error/Success) -->
        {% if messages %}
            <div style="max-width: 450px; margin: 20px auto;">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}" role="alert" style="padding: 10px; background-color: #ffcccc; color: #a00; border: 1px solid #a00; border-radius: 5px;">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <div class="card bg-white rounded">
            <h2 class="text-center mb-4">Forgot Password</h2>
            <p class="text-center text-muted">Enter your registered email address.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3" style="margin-bottom: 15px;">
                    <label class="form-label">Email Address:</label>
                    <input type="email" name="email" required class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                
                <button type="submit" class="btn btn-primary w-100" style="width: 100%; padding: 10px; background-color: #0d6efd; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
                    Next
                </button>
            </form>
            
            <div class="text-center mt-3" style="text-align: center; margin-top: 15px;">
                <a href="{% url 'login' %}" style="text-decoration: none; color: #0d6efd;">Back to Login</a>
            </div>
        </div>
    </div>

</body>
</html>
